# Single source of truth for the CV site and the downloadable CV files.
#
# Text fields can be a plain string (same in every language) or a map with
# `en` / `uk` keys. Missing `uk` falls back to `en`.
# Dates are YYYY-MM. Leave `end` empty for the current position.
# See DEPLOY.md for how to add a job, certification or badge.

person:
  name:
    en: Maksym Sych
    uk: Максим Сич
  title:
    en: DevOps / Platform Engineer
    uk: DevOps / Platform інженер
  photo: static/img/profile.jpg
  location:
    en: Svitlovodsk, Ukraine · open to remote
    uk: Світловодськ, Україна · відкритий до віддаленої роботи
  email: makssych@gmail.com
  website: https://dubass83.xyz
  links:
    - label: LinkedIn
      url: https://www.linkedin.com/in/maxim-sych-/
    - label: GitHub
      url: https://github.com/dubass83
    - label: GitLab
      url: https://gitlab.com/dubass83
  summary:
    en: >-
      DevOps engineer building and running cloud platforms since 2016.
      I design infrastructure as code with Terraform and Terragrunt, run
      Kubernetes in AWS, Azure and on bare metal, and build the CI/CD,
      monitoring and alerting that keep production boring.
    uk: >-
      DevOps-інженер, який з 2016 року будує та підтримує хмарні платформи.
      Проєктую інфраструктуру як код на Terraform і Terragrunt, керую Kubernetes
      в AWS, Azure та на власних серверах, налаштовую CI/CD, моніторинг і
      алертинг, щоб продакшн працював передбачувано.
  languages:
    - name: { en: English, uk: Англійська }
      level: B1
    - name: { en: Ukrainian, uk: Українська }
      level: C2
    - name: { en: Russian, uk: Російська }
      level: C2

# Shields.io-style image badges shown in the header row.
badges:
  - name: SadServers Master
    url: https://sadservers.com
    image: https://img.shields.io/badge/SadServers-Master-FF6D00?style=for-the-badge&labelColor=FFC400&logo=kubernetes&logoColor=1A237E&logoSize=auto

experience:
  - role: { en: DevOps Engineer, uk: DevOps-інженер }
    company: Luxoft
    location: { en: "Dnipro, Ukraine", uk: "Дніпро, Україна" }
    start: 2021-05
    end:  # TODO: still current? Add the date you left and any newer roles above this one.
    highlights:
      - en: Built and maintained an internal microservices platform with Terraform and Terragrunt.
        uk: Створив і підтримую внутрішню платформу для мікросервісів на Terraform і Terragrunt.
      - en: Provisioned and operated managed Kubernetes (EKS, AKS) in AWS and Azure.
        uk: Розгортаю та підтримую керовані Kubernetes-кластери (EKS, AKS) в AWS і Azure.
      - en: Wrote and maintained GitLab CI pipelines for infrastructure and services.
        uk: Пишу та підтримую GitLab CI пайплайни для інфраструктури й сервісів.
      - en: Added Terratest coverage to shared Terraform modules.
        uk: Покрив спільні Terraform-модулі тестами на Terratest.

  - role: { en: DevOps Engineer, uk: DevOps-інженер }
    company: RiverSoft
    location: { en: "Kremenchuk, Ukraine", uk: "Кременчук, Україна" }
    start: 2016-10
    end: 2021-05
    highlights:
      - en: Designed DevOps infrastructure from scratch for several product lines.
        uk: Спроєктував DevOps-інфраструктуру з нуля для кількох продуктових ліній.
      - en: Owned releases and production operations; built Jenkins CI/CD pipelines.
        uk: Відповідав за релізи та експлуатацію продакшну; будував CI/CD на Jenkins.
      - en: Introduced an AWS multi-account strategy.
        uk: Запровадив мультиакаунтну стратегію в AWS.
      - en: Built and secured a Kafka cluster on bare metal (TLS, SASL, ACLs).
        uk: Розгорнув і захистив Kafka-кластер на власних серверах (TLS, SASL, ACL).
      - en: Set up on-call alerting with Prometheus, Alertmanager and PagerDuty.
        uk: Налаштував чергування й алертинг на Prometheus, Alertmanager і PagerDuty.
      - en: Helped developers adopt Vagrant, Ansible and Docker Compose for local environments.
        uk: Допоміг розробникам перейти на Vagrant, Ansible і Docker Compose для локальних середовищ.

skills:
  - group: { en: Cloud, uk: Хмари }
    items: [AWS, Azure, Google Cloud, DigitalOcean]
  - group: Kubernetes
    items: [EKS, AKS, kOps, kubeadm, Helm, Istio, bare metal]
  - group: { en: Infrastructure as code, uk: Інфраструктура як код }
    items: [Terraform, Terragrunt, Terratest, CloudFormation]
  - group: { en: Configuration management, uk: Управління конфігурацією }
    items: [Ansible, Salt]
  - group: CI/CD
    items: [GitLab CI, Jenkins, GitHub Actions, Bamboo, AWS CodeDeploy]
  - group: { en: Observability, uk: Моніторинг }
    items: [Prometheus, Alertmanager, Grafana, Graphite, InfluxDB, Telegraf, collectd, CloudWatch, Zabbix, PagerDuty]
  - group: { en: Data & messaging, uk: Дані та черги }
    items: [PostgreSQL, MySQL, MongoDB, Redis, RabbitMQ, Kafka, Hazelcast]
  - group: { en: Linux & networking, uk: Linux і мережі }
    items: [Amazon Linux, CentOS, Debian, Ubuntu, LVM, NFS, Nginx, iptables, TLS, SSH, Kerberos]
  - group: { en: Languages, uk: Мови }
    items: [Go, Python, SQL]
  - group: { en: Security, uk: Безпека }
    items: [{ en: public-key cryptography, uk: криптографія з відкритим ключем }, PKI, TLS, { en: identity management, uk: управління ідентифікацією }]

